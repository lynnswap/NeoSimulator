name: Publish Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing draft release tag to publish after CI succeeds, for example v1.2.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate and Pin Draft Release
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.draft.outputs.release-id }}
      prerelease: ${{ steps.draft.outputs.prerelease }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out release scripts
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Validate main ref and pin the approved draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 scripts/prepare_release.py prepare --version "$RELEASE_VERSION" --source-sha "$GITHUB_SHA"

  checks:
    name: Release Checks
    needs: validate
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Release Input
    needs: validate
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ inputs.version }}

  sign:
    name: Sign and Notarize DMG
    needs: [checks, build]
    runs-on: macos-26
    timeout-minutes: 50
    environment: release-signing
    outputs:
      artifact-id: ${{ steps.artifact.outputs.artifact-id }}
      dmg-sha256: ${{ steps.sign.outputs.dmg-sha256 }}
      dmg-filename: ${{ steps.sign.outputs.dmg-filename }}
    steps:
      - name: Check out trusted signing scripts
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Python for release tools
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Download this run's validated DMG
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/release-input
          digest-mismatch: error

      - name: Sign and notarize with an ephemeral keychain
        id: sign
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          INPUT_FILENAME: ${{ needs.build.outputs.dmg-filename }}
          INPUT_SHA256: ${{ needs.build.outputs.dmg-sha256 }}
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_API_PRIVATE_KEY: ${{ secrets.NOTARY_API_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          NOTARY_API_KEY_ID: ${{ vars.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER_ID: ${{ vars.NOTARY_API_ISSUER_ID }}
          RELEASE_DIAGNOSTICS_DIRECTORY: ${{ runner.temp }}/notary-diagnostics
        run: |
          python3 scripts/sign_release.py \
            --input-dmg "$RUNNER_TEMP/release-input/$INPUT_FILENAME" \
            --input-sha256 "$INPUT_SHA256" \
            --output-directory "$RUNNER_TEMP/signed-release" \
            --version "$RELEASE_VERSION" \
            --source-sha "$GITHUB_SHA"

      - name: Upload signed release artifacts
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NeoSimulator-signed-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signed-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload notarization diagnostics
        if: ${{ always() && steps.sign.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NeoSimulator-notary-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/notary-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Upload Assets and Publish Release
    needs: [validate, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out trusted release scripts
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Download this run's signed DMG
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact-id }}
          path: ${{ runner.temp }}/signed-release
          digest-mismatch: error

      - name: Publish the approved draft after verifying its assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_ID: ${{ needs.validate.outputs.release-id }}
          RELEASE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          DMG_SHA256: ${{ needs.sign.outputs.dmg-sha256 }}
        run: |
          python3 scripts/prepare_release.py publish \
            --version "$RELEASE_VERSION" \
            --source-sha "$GITHUB_SHA" \
            --directory "$RUNNER_TEMP/signed-release" \
            --dmg-sha256 "$DMG_SHA256" \
            --release-id "$RELEASE_ID" \
            --prerelease "$RELEASE_PRERELEASE"
