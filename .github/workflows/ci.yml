name: CI

on:
  workflow_call:
    inputs:
      concurrency_group:
        description: Concurrency group override for callers.
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - LICENSE
  pull_request:
    paths-ignore:
      - README.md
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ inputs.concurrency_group || format('ci-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  package:
    name: Package (macOS)
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Show Xcode toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test

      - name: Build release product
        run: swift build -c release --product xcode-simulator-host

      - name: Validate distribution scripts
        run: |
          bash -n \
            scripts/build-release.sh \
            scripts/package-release.sh \
            scripts/render-install-script.sh \
            scripts/verify-release-assets.sh
          sh -n scripts/install-release.sh.in
