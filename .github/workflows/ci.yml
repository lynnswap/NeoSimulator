name: CI

on:
  workflow_call:
    inputs:
      concurrency_group:
        description: Concurrency group override for callers.
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - LICENSE
  pull_request:
    paths-ignore:
      - README.md
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ inputs.concurrency_group || format('ci-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  package:
    name: Package (Xcode 27.2)
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      NEOSIMULATOR_DERIVED_DATA_PATH: ${{ github.workspace }}/.build/ci
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Select Xcode
        run: sudo xcode-select --switch "$DEVELOPER_DIR"

      - name: Show Xcode toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version

      - name: Check module graph
        run: scripts/check-module-graph.py

      - name: Build CoreDevice inventory probe
        run: |
          xcodebuild build -workspace NeoSimulator.xcworkspace \
            -scheme CoreDeviceInventoryProbe -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$NEOSIMULATOR_DERIVED_DATA_PATH" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Check live CoreDevice inventory
        run: '"$NEOSIMULATOR_DERIVED_DATA_PATH/Build/Products/Release/CoreDeviceInventoryProbe"'

      - name: Test package
        # No coverage report is consumed; match the app and consumer's Debug build settings.
        run: |
          xcodebuild test -workspace NeoSimulator.xcworkspace -scheme NeoSimulatorKit \
            -destination 'platform=macOS,arch=arm64' \
            -enableCodeCoverage NO \
            -derivedDataPath "$NEOSIMULATOR_DERIVED_DATA_PATH"

      - name: Test app bundle
        run: scripts/test-app-bundle.sh

      - name: Build public API consumer
        working-directory: Examples/MinimalSimulatorApp
        run: |
          xcodebuild build -scheme MinimalSimulatorApp -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$NEOSIMULATOR_DERIVED_DATA_PATH"

      - name: Validate distribution scripts
        run: |
          bash -n \
            scripts/build-local.sh \
            scripts/test-app-bundle.sh \
            scripts/build-release.sh \
            scripts/package-release.sh
          python3 -m compileall -q scripts
          python3 -m unittest discover -s scripts/tests -v
