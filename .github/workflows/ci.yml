name: CI

on:
  workflow_call:
    inputs:
      concurrency_group:
        description: Concurrency group override for callers.
        required: false
        type: string
        default: ""
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - LICENSE
  pull_request:
    paths-ignore:
      - README.md
      - LICENSE
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ inputs.concurrency_group || format('ci-{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  package:
    name: Package (Xcode 27.2)
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Show Xcode toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build CoreDevice inventory probe
        run: |
          xcodebuild build -workspace Tools/PackageTests.xcworkspace \
            -scheme CoreDeviceInventoryProbe -configuration Release \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$RUNNER_TEMP/inventory-probe" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Check live CoreDevice inventory
        run: "$RUNNER_TEMP/inventory-probe/Build/Products/Release/CoreDeviceInventoryProbe"

      - name: Upload CoreDevice inventory probe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coredevice-inventory-probe
          path: ${{ runner.temp }}/inventory-probe/Build/Products/Release/CoreDeviceInventoryProbe
          if-no-files-found: error

      - name: Test package
        run: xcodebuild test -workspace Tools/PackageTests.xcworkspace -scheme NeoSimulatorKit -destination 'platform=macOS,arch=arm64'

      - name: Test app bundle
        run: scripts/test-app-bundle.sh

      - name: Build public API consumer
        working-directory: Examples/MinimalSimulatorApp
        run: xcodebuild build -scheme MinimalSimulatorApp -destination 'platform=macOS,arch=arm64'

      - name: Build release products
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: scripts/build-local.sh

      - name: Validate distribution scripts
        run: |
          bash -n \
            scripts/build-local.sh \
            scripts/test-app-bundle.sh \
            scripts/build-release.sh \
            scripts/package-release.sh
          python3 -m compileall -q scripts
          python3 -m unittest discover -s scripts/tests -v

  coredevice-xcode-26:
    name: CoreDevice (Xcode 26.6)
    needs: package
    runs-on: macos-26
    timeout-minutes: 5
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Show Xcode toolchain
        run: xcodebuild -version

      - name: Download CoreDevice inventory probe
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coredevice-inventory-probe
          path: inventory-probe

      - name: Check live CoreDevice inventory
        run: |
          chmod +x inventory-probe/CoreDeviceInventoryProbe
          inventory-probe/CoreDeviceInventoryProbe
