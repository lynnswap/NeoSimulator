name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Documentation/NeoSimulator.docc/**
      - Sources/NeoSimulatorKit/**
      - Sources/NeoSimulatorUI/**
      - Package.swift
      - Package.resolved
      - scripts/build-documentation.sh
      - .github/workflows/documentation.yml

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    # Symbol graphs build the package, which requires the Xcode that CI builds it with.
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: sudo xcode-select --switch "$DEVELOPER_DIR"

      - name: Build DocC site
        env:
          HOSTING_BASE_PATH: ${{ github.event.repository.name }}
        run: scripts/build-documentation.sh "$HOSTING_BASE_PATH"

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .build/documentation

  deploy:
    name: Deploy documentation
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
